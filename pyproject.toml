[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "sincei"
description = "A user-friendly toolkit for QC, counting, clustering and plotting of single-cell (epi)genomics data."
readme = "README.md"
requires-python = ">=3.10, <3.13"
dynamic = ["version"]
license = {file = "LICENSE.txt"}
authors = [
    {name = "Vivek Bhardwaj"},
    {name = "Fernando Sancho Gómez"},
]
maintainers = [
    {name = "Vivek Bhardwaj", email = "v.bhardwaj@uu.nl"},
    {name = "Fernando Sancho Gómez", email = "f.sanchogomez@uu.nl"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "anndata",
    "mudata",
    "scanpy",
    "umap-learn",
    "polars",
    "igraph",
    "click",
    "typer",
    # for debug logging (referenced from the issue template)
    "session-info",
    "torch",
    "mctorch-lib",
    "gensim",
    "ruptures",
    "tqdm",
    ]

[project.urls]
Documentation = "https://sincei.readthedocs.io/"
Source = "https://github.com/bhardwaj-lab/sincei"
Home-page = "https://github.com/bhardwaj-lab/sincei"
Issues = "https://github.com/bhardwaj-lab/sincei/issues"

[project.scripts]
sincei = "sincei.cli_typer.main:cli"
scFilterBarcodes = "sincei.cli_typer.scFilterBarcodes:cli"
scFilterStats = "sincei.cli_typer.scFilterStats:cli"
scJSD = "sincei.cli_typer.scJSD:cli"
scCountReads = "sincei.cli_typer.scCountReads:cli"
scCountQC = "sincei.cli_typer.scCountQC:cli"
scFindVCRs = "sincei.cli_typer.scFindVCRs:cli"
scScoreFeatures = "sincei.cli_typer.scScoreFeatures:cli"
scCombineSamples = "sincei.cli_typer.scCombineSamples:cli"
scCombineMods = "sincei.cli_typer.scCombineMods:cli"
scReduceDims = "sincei.cli_typer.scReduceDims:cli"
scClusterCells = "sincei.cli_typer.scClusterCells:cli"
scPlotRegion = "sincei.cli_typer.scPlotRegion:cli"
scBulkCoverage = "sincei.cli_typer.scBulkCoverage:cli"
scExportSignal = "sincei.cli_typer.scExportSignal:cli"

[project.optional-dependencies]
dev = [
    # CLI for bumping the version number
    "bump2version",
    "pre-commit",
    "twine>=6.2.0"
]
doc = [
    "sphinx>=9.1.0",
    "sphinx-book-theme>=1.1.4",
    "myst-nb",
    "sphinxcontrib-bibtex>=2.6.5",
    "sphinx-autodoc-typehints",
    "readthedocs-sphinx-ext",
    "sphinx-argparse",
    "sphinx_toolbox",
    "IPython",
    # For notebooks
 #   "ipykernel",
 #   "ipython",
 #   "sphinx-copybutton",
]
test = [
    "pytest"
]

# Maturin-specific configuration
[tool.maturin]
python-source = "."
module-name = "sincei._sincei"
strip = true
bindings = "pyo3"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["sincei/test"]
xfail_strict = true
addopts = [
    "--import-mode=importlib",  # allow using test files with same name
]

[tool.isort]
include_trailing_comma = true
multi_line_output = 3
profile = "black"
skip_glob = ["docs/*"]

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''
