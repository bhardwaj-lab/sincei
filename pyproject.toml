[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "sincei"
description = "A command-line toolkit for exploring single-cell (epi)genomics data."
readme = "README.md"
requires-python = ">=3.10, <3.13"
dynamic = ["version"]
license = {file = "LICENCE.txt"}
authors = [
    {name = "Vivek Bhardwaj"},
    {name = "Fernando Sancho Gómez"},
]
maintainers = [
    {name = "Vivek Bhardwaj", email = "v.bhardwaj@uu.nl"},
    {name = "Fernando Sancho Gómez", email = "f.sanchogomez@uu.nl"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "anndata",
    "mudata",
    "scanpy",
    "deeptools",
    "umap-learn",
    "polars",
    "igraph",
    "leidenalg",
    "click",
    "typer",
    # for debug logging (referenced from the issue template)
    "session-info",
    "torch",
    "mctorch-lib",
    "gensim",
    "ruptures",
    "tqdm",
    ]

[project.urls]
Documentation = "https://sincei.readthedocs.io/"
Source = "https://github.com/bhardwaj-lab/sincei"
Home-page = "https://github.com/bhardwaj-lab/sincei"
Issues = "https://github.com/bhardwaj-lab/sincei/issues"

[project.scripts]
sincei = "sincei.cli.main:cli"
scFilterBarcodes = "sincei.cli.scFilterBarcodes:cli"
scFilterStats = "sincei.cli.scFilterStats:cli"
scJSD = "sincei.cli.scJSD:cli"
scCountReads = "sincei.cli.scCountReads:cli"
scCountQC = "sincei.cli.scCountQC:cli"
scFindVCRs = "sincei.cli.scFindVCRs:cli"
scScoreFeatures = "sincei.cli.scScoreFeatures:cli"
scCombineCounts = "sincei.cli.scCombineCounts:cli"
scClusterCells = "sincei.cli.scClusterCells:cli"
scPlotRegion = "sincei.cli.scPlotRegion:cli"
scBulkCoverage = "sincei.cli.scBulkCoverage:cli"
scExportSignal = "sincei.cli.scExportSignal:cli"

[project.optional-dependencies]
doc = [
    "sphinx>=9.1.0",
    "sphinx-book-theme",
    "sphinxcontrib-bibtex",
    "readthedocs-sphinx-ext",
    "sphinx-argparse",
    "sphinx_toolbox",
    "nbsphinx",
    "ipywidgets",
]
test = [
    "pytest"
]

# Maturin-specific configuration
[tool.maturin]
python-source = "."
module-name = "sincei._sincei"
strip = true
bindings = "pyo3"
features = ["pyo3/extension-module"]

[tool.coverage.run]
source = ["sincei"]
parallel = true
omit = ["*/__pycache__/*"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = [
    "--import-mode=importlib",  # allow using test files with same name
]

[tool.isort]
include_trailing_comma = true
multi_line_output = 3
profile = "black"
skip_glob = ["docs/*"]

[tool.ruff]
src = ["."]
include = [
    "sincei/**/*.py",
    "tests/**/*.py",
    "pyproject.toml",
]

format.preview = true
format.docstring-code-format = true
lint.select = [
    "ANN",  # Annotations
    "B",    # Likely bugs and design issues
    "BLE",  # Blind except
    "C4",   # Comprehensions
    "E",    # Error detected by Pycodestyle
    "EM",   # Traceback-friendly error messages
    "F",    # Errors detected by Pyflakes
    "I",    # isort
    "ICN",  # Follow import conventions
    "ISC",  # Implicit string concatenation
    "PERF", # Performance
    "PIE",  # Syntax simplifications
    "PL",   # Pylint
    "PT",   # Pytest conventions
    "PTH",  # Pathlib instead of os.path
    "PYI",  # Typing
    "RUF",  # Unused noqa
    "SIM",  # Code simplifications
    "TC",   # manage type checking blocks
    "TID",  # Banned imports
    "UP",   # pyupgrade
    "W",    # Warning detected by Pycodestyle
]

lint.ignore = [
    "FBT", # Boolean positional arguments
    "PLR2004", # Magic numbers
    "PLR0913", # Too many arguments
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "PLR0917", # Too many positional arguments
]
