# https://docs.codecov.com/docs/codecovyml-reference

codecov:
  require_ci_to_pass: true
  notify:
    # Two reports arrive per commit: `python` from test-python and `rust` from
    # test-rust. Wait for both before posting a status.
    after_n_builds: 2

coverage:
  precision: 2
  round: down
  range: "60...90"
  status:
    project:
      default:
        target: auto
        threshold: 1%
      python:
        target: auto
        threshold: 1%
        flags: [python]
      rust:
        target: auto
        threshold: 1%
        flags: [rust]
    patch:
      default:
        target: 80%
        threshold: 5%

flags:
  python:
    paths:
      - sincei/
    carryforward: true
  rust:
    paths:
      - src/
    carryforward: true

comment:
  layout: "condensed_header, diff, flags, components, condensed_files"
  behavior: default
  require_changes: false
  # Both suites upload. Without this, the first comment shows only one half of
  # the project.
  after_n_builds: 2

ignore:
  - "tests/**"
  - "docs/**"
  - "benchmarks/**"
