name: lint-python

on:
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/ruff-action@v4
        with:
          # Pinned: ruff is pre-1.0, so a minor bump may add or change rules.
          version: "0.16.3"
          args: check --output-format=github

  format:
    name: ruff format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/ruff-action@v4
        with:
          # Pinned: ruff is pre-1.0, so a minor bump may add or change rules.
          version: "0.16.3"
          args: format --check --diff
