version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "rust_release"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 30
    groups:
      rust-crates:
        patterns: ["*"]
    ignore:
      - dependency-name: "nalgebra-sparse"
        versions: [">=0.12"]

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "rust_release"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 30
    groups:
      python-packages:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: "rust_release"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 30
    groups:
      github-actions:
        patterns: ["*"]
