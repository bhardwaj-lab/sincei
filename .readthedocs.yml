# yaml file to configure readthedocs build
version: 2

build:
    os: ubuntu-24.04
    tools:
        python: "3.12"
        rust: "latest"
    apt_packages:
        # hdf5-metno-src, blosc-src, zstd-sys and lz4-sys each compile their C
        # library from source.
        - cmake
    jobs:
        install:
            # The docs workflow builds the wheel for this commit and starts the
            # docs build, passing the wheel to Read the Docs. The build fails if
            # the sincei wheel cannot be downloaded.
            - asdf plugin add uv
            - asdf install uv latest
            - asdf global uv latest
            - |
              export VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH
              python docs/fetch_wheel.py dist && uv pip install "$(ls dist/*.whl)[doc]"

sphinx:
    configuration: docs/conf.py
    # disable this for more lenient docs builds
    fail_on_warning: false
